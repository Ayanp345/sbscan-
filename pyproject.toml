[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbscan"
version = "0.1.0"
description = "Semantic Backdoor Scanner - activation-level detection of latent trojans in fine-tuned LLM weights"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
hf = ["transformers>=4.40", "peft>=0.10", "accelerate>=0.28"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
